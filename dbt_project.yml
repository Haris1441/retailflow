name: retailflow
version: 1.0.0
config-version: 2
profile: retailflow

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
analysis-paths: [analyses]
snapshot-paths: [snapshots]
target-path: target
clean-targets: [target, dbt_packages]

models:
  retailflow:
    staging:
      +materialized: view
      +schema: STAGING
      +tags: [staging]
    silver:
      +materialized: table
      +schema: SILVER
      +tags: [silver]
      intermediate:
        +materialized: ephemeral

seeds:
  retailflow:
    +schema: SILVER
    +tags: [silver]
