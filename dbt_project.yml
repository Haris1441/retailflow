name: retailflow
version: 1.0.0
config-version: 2
profile: retailflow

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
analysis-paths: [analyses]
snapshot-paths: [snapshots]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Phase 10 CDC simulation: last visible BigQuery batch. BATCH_999 means all batches.
  cdc_through_batch: BATCH_999
  # Hours re-read before an incremental model's watermark. Batch arrivals are immutable,
  # so 0 is exact; raise it to demonstrate a harmless replay.
  silver_lookback_hours: 0

models:
  retailflow:
    staging:
      +materialized: view
      +schema: STAGING
      +tags: [staging]
    silver:
      +materialized: table
      +schema: SILVER
      +tags: [silver]
      intermediate:
        +materialized: ephemeral

    data_quality:
      +materialized: table
      +schema: DATA_QUALITY
      +tags: [data_quality]
      checks:
        +materialized: ephemeral

seeds:
  retailflow:
    +schema: SILVER
    +tags: [silver]
