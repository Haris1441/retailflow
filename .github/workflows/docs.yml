# Phase 15 · Continuous delivery of the dbt documentation site to GitHub Pages.
# Runs on every push to main. Builds dbt docs without a Snowflake connection (descriptions, tests,
# sources and lineage come from the project; column data types would need a live catalog).
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "dbt_retailflow/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dbt docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dbt_retailflow
    env:
      RETAILFLOW_SF_ACCOUNT: ci-placeholder
      RETAILFLOW_SF_USER: ci-placeholder
      RETAILFLOW_SF_PASSWORD: ci-placeholder
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dbt_retailflow/requirements.txt
      - run: pip install -r requirements.txt
      - run: cp profiles.yml.example profiles.yml
      - run: dbt parse --profiles-dir .
      - run: dbt docs generate --profiles-dir . --no-compile --empty-catalog --static
      - name: Assemble site
        run: mkdir -p ../site && cp target/static_index.html ../site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
